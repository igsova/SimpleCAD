# Builds the documentation site and publishes it to GitHub Pages.
# Pull requests only check that it builds with every link and anchor intact.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - mkdocs.yml
      - scripts/docs_hooks.py
      - Resources/icons/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - mkdocs.yml
      - scripts/docs_hooks.py
      - Resources/icons/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a deployment half way; a newer pull request run replaces an older one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
